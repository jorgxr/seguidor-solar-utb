
name: Publicar Seguidor Solar UTB

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seguidor-solar-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar ThingSpeak y filtrar datos
        env:
          TS_READ_ORIENTACION: ${{ secrets.TS_READ_ORIENTACION }}
          TS_READ_GPS_SOL: ${{ secrets.TS_READ_GPS_SOL }}
          TS_READ_DIAGNOSTICO: ${{ secrets.TS_READ_DIAGNOSTICO }}
        run: python scripts/export_public.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio web
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4
